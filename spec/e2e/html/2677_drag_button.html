<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>drag button demo</title>

  <link rel="stylesheet" href="../../../demo/demo.css" />
  <script src="../../../dist/gridstack-all.js"></script>
  <style>
    .handle { cursor: move }
  </style>
</head>

<template id="button-handle">
  <div>
    <div class="grid-stack-item-content">
      <button class="handle">Handle</button>
    </div>
  </div>
</template>

<template id="span">
  <div>
    <div class="grid-stack-item-content">
      <span class="handle">Handle</span>
    </div>
  </div>
</template>

<body>
  <div class="grid-stack"></div>
  <script type="text/javascript">
    let grid = GridStack.init({handle: '.handle', cellHeight: 70});

    function cloneFromTemplate(templateId) {
      return document.getElementById(templateId).content.cloneNode(true).firstElementChild;
    }

    grid.addWidget(cloneFromTemplate('button-handle'), {x: 0, y: 0});
    grid.addWidget(cloneFromTemplate('span-handle'), {x: 1, y: 0, w: 3});
  </script>
</body>
</html>
